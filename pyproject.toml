[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nonebot-plugin-bupt-charge"
version = "0.1.0"
description = "NoneBot2 OneBot V11 plugin for BUPT charging socket availability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "nonebot2>=2.3.0",
  "nonebot-adapter-onebot>=2.3.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
]
classifiers = [
  "Topic :: Communications :: Chat",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "nonebot2[fastapi]>=2.3.0"]

[tool.setuptools.packages.find]
include = ["nonebot_plugin_bupt_charge*"]

[tool.setuptools.package-data]
nonebot_plugin_bupt_charge = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
